<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>트립플로 · 국내 여행 비서 (알파)</title>
  <base href="/">
  <!--
    iOS는 글꼴이 16px보다 작은 입력란에 초점이 가면 화면을 확대하고, 초점이
    빠져도 배율을 되돌리지 않는다. 지역 검색과 여행 기간에서 한 번 커진 화면이
    그대로 남아 확대를 막는다. 손가락 확대도 함께 닫히는 점은 감수한다.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <meta name="color-scheme" content="light">
  <!-- 상단 바와 같은 흰색이라 상태 표시줄이 앱 화면으로 이어져 보인다. -->
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="트립플로">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" sizes="any" href="brand/triplo-favicon.svg">
  <link rel="apple-touch-icon" href="brand/triplo-app-icon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
