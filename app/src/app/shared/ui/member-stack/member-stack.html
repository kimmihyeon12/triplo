<span class="flex -space-x-1.5" aria-hidden="true">
  <span
    class="flex size-7 items-center justify-center rounded-full border-2 border-panel text-12 font-semibold"
    [style.background]="tone().bg"
    [style.color]="tone().fg"
    >{{ me().initial }}</span
  >
  <span
    class="flex size-7 items-center justify-center rounded-full border-2 border-panel bg-ground-2 text-12 font-semibold text-ink-2"
    >+{{ others() }}</span
  >
</span>
