<!--
  원근은 바깥 상자가 잡고 카드만 기울인다. 카드 자신에게 perspective를 주면
  회전축이 카드와 함께 돌아 기울기가 어긋난다.
-->
<div
  class="flex justify-center py-2 perspective-[1100px]"
  (pointermove)="onPointerMove($event)"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerLeave()"
  (pointerleave)="onPointerLeave()"
  (pointercancel)="onPointerLeave()"
>
  <!--
    티켓은 눌러 보는 장식이라 글자를 끌어 선택할 일이 없다. 선택을 막지 않으면
    손가락으로 누르는 순간 텍스트가 잡혀 끌리는 것처럼 보인다. 스크롤은 그대로 둔다.
    base.css가 p·li의 선택을 요소 선택자로 되살리므로, 상자에만 걸면 안쪽 글자가
    그 규칙을 따라 다시 잡힌다. 자손까지 함께 막아야 실제로 끌리지 않는다.
  -->
  <!--
    안쪽 티켓이 절취선 홈을 자기 가장자리에 붙일 수 있도록 이 상자가 폭과
    위치 기준을 잡는다. display:contents로 넘기면 홈이 기준을 잃고 밖으로 나간다.
  -->
  <div
    class="relative w-full max-w-sm select-none **:select-none transform-3d [transition:transform_260ms_var(--ease-out)] [-webkit-touch-callout:none] **:[-webkit-touch-callout:none] motion-reduce:[transition:none]"
    [style.transform]="ticketTransform()"
  >
    <!--
      그림자는 티켓 한 장 전체에 한 번만 준다. 본권과 반권이 각자 그림자를 가지면
      한쪽 테두리 때문에 다른 쪽이 더 넓어 보이고, 절취선에서 그림자가 겹친다.
      뒤에 깔린 층이라 안쪽 내용의 모서리는 그대로 각자 맡는다.
    -->
    <span class="absolute inset-0 rounded-panel shadow-panel" aria-hidden="true"></span>
    <ng-content />
  </div>
</div>
