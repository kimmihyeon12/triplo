<div
  class="toast grid gap-2.5 items-center rounded-panel bg-ink text-panel grid-cols-[28px_minmax(0,1fr)_44px] pt-2.5 pr-2 pb-2.5 pl-4 [box-shadow:0_8px_24px_-6px_rgb(22_24_29/0.24)] animate-[toast-enter_180ms_cubic-bezier(0.16,1,0.3,1)] motion-reduce:animate-none"
  role="alert"
  aria-atomic="true"
  data-testid="error-toast"
>
  <span
    class="toast__icon grid place-items-center w-7 h-7 rounded-full bg-danger-tint text-danger-ink"
    aria-hidden="true"
    ><app-icon name="alert" [size]="16"
  /></span>
  <p class="m-0 text-14 font-medium leading-[1.55] wrap-anywhere">{{ message() }}</p>
  <button
    class="grid place-items-center w-11 h-11 p-0 border-0 rounded-control bg-transparent cursor-pointer text-inherit hover:[background:rgb(255_255_255/0.1)] focus-visible:[outline:2px_solid_currentColor] focus-visible:-outline-offset-4"
    type="button"
    aria-label="오류 알림 닫기"
    (click)="dismissed.emit()"
  >
    <app-icon name="x" [size]="18" />
  </button>
</div>
