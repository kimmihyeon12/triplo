<!--
  흰 카드 위에 빨간 표시만 두는 가벼운 알림(2026-09-29 사용자 결정). 짙은 바탕은
  화면에서 가장 어두운 덩어리가 되어 눈을 끌었다. 테두리와 그림자로 바탕에서
  떼어 내고, 오류라는 것은 아이콘 색으로만 알린다.
-->
<div
  class="toast grid grid-cols-[24px_minmax(0,1fr)_40px] items-center gap-2.5 rounded-panel border border-border bg-panel py-2 pr-1.5 pl-3.5 text-ink [box-shadow:0_12px_32px_-12px_rgb(22_24_29/0.28)] animate-[toast-enter_180ms_cubic-bezier(0.16,1,0.3,1)] motion-reduce:animate-none"
  role="alert"
  aria-atomic="true"
  data-testid="error-toast"
>
  <span
    class="toast__icon grid size-6 place-items-center rounded-full bg-danger-tint text-danger-ink"
    aria-hidden="true"
    ><app-icon name="alert" [size]="14"
  /></span>
  <p class="m-0 text-14 font-medium leading-[1.5] wrap-anywhere">{{ message() }}</p>
  <button
    class="grid size-10 cursor-pointer place-items-center rounded-control border-0 bg-transparent p-0 text-ink-3 hover:bg-ground-2 hover:text-ink focus-visible:[outline:2px_solid_var(--color-accent-deep)] focus-visible:-outline-offset-4"
    type="button"
    aria-label="오류 알림 닫기"
    (click)="dismissed.emit()"
  >
    <app-icon name="x" [size]="16" />
  </button>
</div>
