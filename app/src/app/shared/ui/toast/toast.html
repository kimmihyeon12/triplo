<!--
  알림 토스트(2026-09-29 사용자 결정). 종류마다 연한 바탕·테두리와 아이콘 색으로
  구분하고 글자는 본문색으로 둔다: 성공은 초록, 안내는 파랑, 오류는 빨강. 바탕은 옅은 종류색을 흰 유리에 얹어
  뒤가 비치게 하고(블러 24·채도 180·흰 테두리) 화면 위에 떠 있는 느낌을 준다(2026-10-02 사용자 결정, 시안 C).
  모든 화면에서 위쪽 같은 자리에 뜨며, X를 누르거나 위로 밀어 닫는다.
  오류에 할 일이 있으면 X 앞에 버튼으로 둔다. 알림이 가린 자리의 버튼을 대신한다.
  오류만 alert로 읽어 주고, 성공·안내는 흐름을 끊지 않게 status로 읽는다.
-->
<div
  class="toast grid min-h-13 grid-cols-[24px_minmax(0,1fr)_32px] items-center gap-2.5 rounded-panel py-2 pr-1.5 pl-3.5 text-ink touch-none select-none [backdrop-filter:blur(24px)_saturate(180%)] [-webkit-backdrop-filter:blur(24px)_saturate(180%)] [border:1px_solid_rgb(255_255_255/0.65)] [box-shadow:0_8px_24px_-10px_rgb(22_24_29/0.25)] animate-[toast-enter_180ms_cubic-bezier(0.16,1,0.3,1)] motion-reduce:animate-none"
  [class]="tone().card"
  [attr.role]="kind() === 'error' ? 'alert' : 'status'"
  aria-atomic="true"
  [attr.data-testid]="kind() + '-toast'"
  [style.grid-template-columns]="action() ? '24px minmax(0,1fr) auto 32px' : null"
  [style.transform]="offset() ? 'translateY(' + offset() + 'px)' : null"
  [style.opacity]="offset() ? 1 + offset() / 120 : null"
  [style.transition]="dragging() ? 'none' : 'transform 180ms ease, opacity 180ms ease'"
  (pointerdown)="start($event)"
  (pointermove)="move($event)"
  (pointerup)="end()"
  (pointercancel)="end()"
>
  <span class="toast__icon grid size-6 place-items-center" [class]="tone().icon" aria-hidden="true"
    ><app-icon [name]="tone().glyph" [size]="16"
  /></span>
  <p class="m-0 text-14 font-medium leading-[1.5] wrap-anywhere">{{ message() }}</p>
  @if (action(); as a) {
    <!-- 시안 C(2026-10-02): 반투명 흰 버튼. 오류도 같은 모양으로 두고 종류는 아이콘·바탕색이 알린다. -->
    <button
      type="button"
      class="cursor-pointer rounded-[9px] border border-[rgb(255_255_255/0.9)] bg-[rgb(255_255_255/0.75)] px-2.5 py-1.5 text-12 font-bold whitespace-nowrap text-ink hover:bg-panel focus-visible:[outline:2px_solid_var(--color-accent-deep)] focus-visible:outline-offset-2"
      data-testid="toast-action"
      (click)="act(a)"
    >
      {{ a.label }}
    </button>
  }
  <button
    class="grid size-8 cursor-pointer place-items-center rounded-[8px] border-0 bg-transparent p-0 text-ink opacity-70 hover:opacity-100 focus-visible:[outline:2px_solid_var(--color-accent-deep)] focus-visible:-outline-offset-4"
    [class]="tone().close"
    type="button"
    [attr.aria-label]="tone().label"
    (click)="dismissed.emit()"
  >
    <app-icon name="x" [size]="16" />
  </button>
</div>
