<!-- 열렸을 때 배경(z-10010)보다 위에 있어야 클릭이 막히지 않는다. -->
<details
  #menu
  appDismissible
  class="relative [&[open]]:z-[10020]"
  (toggle)="onToggle(menu.open)"
>
  <summary
    class="flex size-9 cursor-pointer list-none items-center justify-center rounded-control text-ink-3 [transition:background-color_var(--dur)_var(--ease-out),color_var(--dur)_var(--ease-out)] hover:bg-ground-2 hover:text-ink focus-visible:[outline:2px_solid_var(--color-accent-deep)] focus-visible:[outline-offset:2px] [&::-webkit-details-marker]:hidden"
    [attr.aria-label]="ariaLabel()"
    [attr.data-testid]="testId() || null"
  >
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <circle cx="5" cy="12" r="1.7" />
      <circle cx="12" cy="12" r="1.7" />
      <circle cx="19" cy="12" r="1.7" />
    </svg>
  </summary>
  <!--
    카드가 쌓임 맥락을 만들면 absolute로는 z-index를 아무리 올려도 갇힌다.
    화면 기준으로 띄우고 위치는 버튼 좌표로 직접 계산한다.
  -->
  <div
    class="fixed z-[10020] grid w-44 gap-0.5 rounded-panel border border-border bg-panel p-1 shadow-float"
    [style.top.px]="position().top"
    [style.left.px]="position().left"
    role="menu"
  >
    @for (item of items(); track item.id) {
      <button
        class="flex min-h-11 items-center gap-2.5 rounded-control px-3 text-14 [transition:background-color_var(--dur)_var(--ease-out)] focus-visible:[outline:2px_solid_var(--color-accent-deep)] focus-visible:[outline-offset:-2px]"
        [class]="
          item.danger ? 'text-danger-ink hover:bg-danger-tint' : 'text-ink hover:bg-ground-2'
        "
        type="button"
        role="menuitem"
        [attr.data-testid]="item.testId || null"
        (click)="menu.open = false; selected.emit(item.id)"
      >
        @if (item.icon) {
          <app-icon [name]="item.icon" [size]="16" />
        }
        {{ item.label }}
      </button>
    }
  </div>
</details>
