<div class="flex items-center">
  <a
    [routerLink]="tools().inviteLink"
    aria-label="친구 초대"
    class="group flex min-h-11 min-w-11 items-center justify-center -space-x-2 rounded-full px-1 no-underline focus-visible:outline-2 focus-visible:outline-offset-2"
  >
    @for (person of tools().people.slice(0, 2); track person.id) {
      <span
        [title]="person.name"
        class="flex size-8 items-center justify-center rounded-full border-2 border-panel bg-blue-50 text-xs font-semibold text-blue-800"
        >{{ person.name.slice(0, 1) }}</span
      >
    }
    @if (tools().people.length > 2) {
      <span
        class="flex size-8 items-center justify-center rounded-full border-2 border-panel bg-gray-100 text-xs text-ink-2"
        >+{{ tools().people.length - 2 }}</span
      >
    }
    <span
      class="relative flex size-8 items-center justify-center rounded-full border-2 border-panel bg-ground-2 text-ink-2 transition-colors group-hover:bg-accent-tint group-hover:text-accent-deep"
      ><svg
        aria-hidden="true"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      >
        <path d="M12 6v12M6 12h12" /></svg
    ></span>
  </a>
  <details #menu class="relative" (keydown.escape)="menu.open = false">
    <summary
      aria-label="여행 더보기"
      class="flex size-11 cursor-pointer list-none items-center justify-center rounded-lg text-ink-2 hover:bg-ground-2 focus-visible:outline-2 [&::-webkit-details-marker]:hidden"
    >
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="12" r="1.7" />
        <circle cx="12" cy="12" r="1.7" />
        <circle cx="19" cy="12" r="1.7" />
      </svg>
    </summary>
    <div
      class="absolute right-0 z-20 mt-1 w-44 rounded-xl border border-border bg-panel p-1 shadow-lg"
    >
      @for (item of tools().menu; track item.label) {
        <a
          [routerLink]="item.link"
          [queryParams]="item.queryParams ?? {}"
          (click)="menu.open = false"
          class="flex min-h-11 items-center rounded-lg px-3 text-sm text-ink no-underline hover:bg-ground-2 focus-visible:outline-2"
          >{{ item.label }}</a
        >
      }
    </div>
  </details>
</div>
