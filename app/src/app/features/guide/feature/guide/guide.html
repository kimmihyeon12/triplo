<div class="flex h-[calc(100dvh-53px)] flex-col" data-testid="guide" tabindex="-1">
  <!--
    앱 화면 그림이 화면 전체를 채운다. 회색 덮개에서 설명할 요소만 밝게 뚫고, 그 옆 회색 자리에 설명 글을 단다.
    번호를 쓰지 않아 지도의 방문 순번과 헷갈리지 않는다. 좌우로 끌어 넘긴다.
  -->
  <div
    #viewport
    class="relative min-h-0 flex-1 touch-pan-y select-none overflow-hidden bg-ground"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    data-testid="guide-stage"
  >
    <div
      class="flex h-full"
      [style.transition]="dragging() ? 'none' : 'transform 320ms var(--ease-out)'"
      [style.transform]="track()"
    >
      @for (s of slides; track s.key; let i = $index) {
        <section
          class="h-full w-full flex-none"
          [attr.data-slide]="i"
          [attr.aria-hidden]="i !== index()"
          data-testid="guide-slide"
        >
          <div class="relative h-full w-full">
          <img
            class="absolute block max-w-none"
            [src]="image(s)"
            [alt]="s.alt"
            [style.left.px]="shot().x"
            [style.top.px]="shot().y"
            [style.width.px]="shot().w"
            [style.height.px]="shot().h"
            [attr.loading]="i < 2 ? 'eager' : 'lazy'"
            draggable="false"
            data-testid="guide-image"
          />

          <svg class="pointer-events-none absolute inset-0 h-full w-full" aria-hidden="true">
            <defs>
              <mask [attr.id]="'guide-mask-' + i">
                <rect width="100%" height="100%" fill="white" />
                @for (h of layouts()[i]!.holes; track $index) {
                  <rect [attr.x]="h.x" [attr.y]="h.y" [attr.width]="h.w" [attr.height]="h.h" [attr.rx]="h.r" fill="black" />
                }
              </mask>
            </defs>
            <rect width="100%" height="100%" fill="rgb(22 24 29 / 0.62)" [attr.mask]="'url(#guide-mask-' + i + ')'" />
            @for (h of layouts()[i]!.holes; track $index) {
              <rect
                [attr.x]="h.x"
                [attr.y]="h.y"
                [attr.width]="h.w"
                [attr.height]="h.h"
                [attr.rx]="h.r"
                fill="none"
                stroke="white"
                stroke-opacity="0.9"
                stroke-width="1.5"
              />
            }
            @for (c of layouts()[i]!.callouts; track c.label) {
              @if (c.side !== 'inside') {
                <line [attr.x1]="c.x" [attr.y1]="c.fromY" [attr.x2]="c.x" [attr.y2]="c.toY" stroke="white" stroke-width="1" />
                <circle [attr.cx]="c.x" [attr.cy]="c.fromY" r="2.5" fill="white" />
              }
            }
          </svg>

          <ul class="pointer-events-none m-0 list-none p-0" data-testid="guide-callouts">
            @for (c of layouts()[i]!.callouts; track c.label) {
              <li
                class="absolute flex items-center justify-center rounded-[8px] bg-[rgb(22_24_29/0.92)] px-[7px] text-center whitespace-nowrap text-[11px] leading-[15px] font-medium text-white shadow-[0_2px_8px_rgb(0_0_0/0.18)]"
                [style.left.px]="c.box.x"
                [style.top.px]="c.box.y"
                [style.width.px]="c.box.w"
                [style.height.px]="c.box.h"
                data-testid="guide-callout"
              >
                {{ c.label }}
              </li>
            }
          </ul>
          </div>
        </section>
      }
    </div>
  </div>

  <!-- 아래 안내판: 기능 이름과 설명, 장 점, 이전·다음 -->
  <div class="border-t border-border bg-panel px-4 pt-3 pb-[calc(12px+env(safe-area-inset-bottom))]">
    <div class="mx-auto max-w-(--content-narrow)">
      <h2 class="m-0 text-15 font-bold leading-snug" aria-live="polite" data-testid="guide-title">{{ slide().title }}</h2>
      <p class="m-0 mt-0.5 min-h-9 text-12 leading-normal text-ink-2" data-testid="guide-description">{{ slide().description }}</p>
      <div class="mt-2 flex items-center gap-3">
        <button appButton type="button" class="btn w-22" [disabled]="index() === 0" (click)="go(index() - 1)" data-testid="guide-prev">
          이전
        </button>
        <div class="flex flex-1 items-center justify-center gap-1.5" role="tablist" aria-label="안내 장">
          @for (s of slides; track s.key; let i = $index) {
            <button
              type="button"
              role="tab"
              class="h-1.5 rounded-full border-0 p-0 [transition:background-color_var(--dur)_var(--ease-out),width_var(--dur)_var(--ease-out)]"
              [style.width.px]="i === index() ? 16 : 6"
              [style.background]="i === index() ? 'var(--color-accent-deep)' : 'var(--color-border-strong)'"
              [attr.aria-selected]="i === index()"
              [attr.aria-label]="i + 1 + '장 ' + s.title"
              (click)="go(i)"
            ></button>
          }
          <span class="sr-only" data-testid="guide-step">{{ index() + 1 }} / {{ slides.length }}</span>
        </div>
        <button appButton type="button" variant="primary" class="btn w-22" (click)="next()" data-testid="guide-next">
          {{ last() ? '시작하기' : '다음' }}
        </button>
      </div>
    </div>
  </div>
</div>
