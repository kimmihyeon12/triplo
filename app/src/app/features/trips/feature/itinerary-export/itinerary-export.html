<!-- 미리보기가 길어 저장 버튼이 스크롤 아래로 밀리므로 하단에 고정한다. -->
<div class="mx-auto max-w-180 px-4 py-6 pb-[calc(var(--sp-6)+80px)] md:px-6">
  <p class="mb-6 text-14 text-ink-2">필요한 일정만 골라 한 장의 이미지로 저장하세요.</p>
  @if (store.current(); as trip) {
    <section class="mb-6 rounded-panel bg-panel p-4 shadow-panel">
      <app-field label="저장할 일정" inputId="export-date"
        ><select appInput id="export-date" [ngModel]="date()" (ngModelChange)="date.set($event)">
          <option value="">전체 일정</option>
          @for (section of allSections(); track section.key) {
            <option [value]="section.key">{{ section.title }}</option>
          }
        </select></app-field
      >
      <app-checkbox
        label="예상 비용 포함"
        inputId="export-costs"
        hint="개인 메모·예약정보·가계부·지도는 이미지에 포함하지 않습니다."
        [(checked)]="includeCosts"
      />
      <!-- 접은 날짜는 이미지에도 요약 한 줄로 들어간다. 미리보기가 곧 결과다. -->
      <div class="mt-4 flex items-center justify-between gap-3 border-t border-border pt-4">
        <p class="text-13 text-ink-2">
          {{
            allCollapsed()
              ? '티켓 한 장만 저장됩니다.'
              : '접은 날짜는 요약 한 줄로 저장됩니다.'
          }}
        </p>
        <button
          appButton
          type="button"
          variant="ghost"
          class="flex-none"
          (click)="toggleAll()"
          data-testid="toggle-all-sections"
        >
          {{ allCollapsed() ? '모두 펼치기' : '모두 접기' }}
        </button>
      </div>
    </section>
    @if (ticket(); as ticket) {
      <app-itinerary-snapshot
        [ticket]="ticket"
        [sections]="sections()"
        [includeCosts]="includeCosts()"
        [collapsed]="collapsed()"
        [foldable]="true"
        (toggled)="toggleSection($event)"
      />
    }
    <div appActionBar class="action-bar">
      <div class="action-bar__inner mx-auto my-0 flex justify-center max-w-(--content-max)">
        <button
          appButton
          type="button"
          variant="primary"
          class="w-full [@media(min-width:_720px)]:w-auto [@media(min-width:_720px)]:px-8"
          [loading]="busy()"
          (click)="download()"
          data-testid="download-itinerary"
        >
          PNG 이미지 저장
        </button>
      </div>
    </div>
  } @else {
    <p class="py-8 text-ink-3" role="status">
      {{
        store.currentState() === 'loading'
          ? '일정을 불러오는 중입니다.'
          : '여행을 찾을 수 없습니다.'
      }}
    </p>
  }
  @if (error()) {
    <app-error-toast [message]="error()" (dismissed)="error.set('')" />
  }
</div>
