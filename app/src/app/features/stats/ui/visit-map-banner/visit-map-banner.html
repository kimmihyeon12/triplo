<!--
  기록이 있을 때만 카드로 띄우고, 없으면 점선 테두리로 가라앉힌다.
  두 경우 모두 링크는 살아 있어 빈 지도 화면으로 갈 수 있다.
-->
<a
  class="flex items-center gap-3 rounded-panel p-3.5 no-underline text-inherit [transition:border-color_var(--dur)_var(--ease-out),transform_var(--dur)_var(--ease-out)] active:scale-[0.99] focus-visible:[outline:2px_solid_var(--color-accent-deep)] focus-visible:-outline-offset-2"
  [class]="
    hasRecord()
      ? 'bg-panel shadow-panel [border:1px_solid_transparent] hover:border-border-strong'
      : '[border:1px_dashed_var(--color-border-strong)] hover:bg-panel'
  "
  routerLink="/stats"
  data-testid="go-stats"
>
  <!--
    한반도는 세로로 길다. 가로로 넓은 칸에 넣으면 좌우 여백만 남고 도형이
    작아지므로 섬네일을 정사각에 가깝게 둔다.
  -->
  <span
    class="flex size-14.5 flex-none items-center justify-center overflow-hidden rounded-control bg-map-water [background:radial-gradient(ellipse_at_50%_25%,var(--color-map-water-light),var(--color-map-water))]"
    aria-hidden="true"
  >
    <!--
      격자가 아니라 윤곽으로 그린다. 이 크기에서 35칸을 줄이면 한반도로
      읽히지 않는다. 정확한 격자는 /stats 화면이 맡는다.
    -->
    <svg [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMid meet" class="h-full w-full">
      <path
        [attr.d]="mainland"
        [attr.fill]="land()"
        [attr.stroke]="outline"
        stroke-width="1.3"
        stroke-linejoin="round"
      />
      <ellipse
        [attr.cx]="jeju.cx"
        [attr.cy]="jeju.cy"
        [attr.rx]="jeju.rx"
        [attr.ry]="jeju.ry"
        [attr.fill]="land()"
        [attr.stroke]="outline"
        stroke-width="1.3"
      />
      @for (dot of dots(); track dot.regionCode) {
        <circle
          [attr.cx]="dot.cx"
          [attr.cy]="dot.cy"
          [attr.r]="dot.haloR"
          [attr.fill]="dot.fill"
          opacity="0.25"
        />
        <!-- 서울·경기처럼 붙은 지역이 겹쳐도 서로 구분되도록 지형색 테두리를 준다. -->
        <circle
          [attr.cx]="dot.cx"
          [attr.cy]="dot.cy"
          [attr.r]="dot.r"
          [attr.fill]="dot.fill"
          [attr.stroke]="land()"
          stroke-width="0.9"
        />
      }
    </svg>
  </span>

  <span class="min-w-0 flex-1">
    <strong class="block text-14 font-bold" [class.text-ink-2]="!hasRecord()">
      다녀온 곳 지도
    </strong>

    @if (hasRecord()) {
      <!-- 단위는 통계 화면과 같은 '곳'이다. 담긴 장소·숙소의 개수를 센다. -->
      <small class="mt-1 block text-12 leading-normal text-ink-3">
        {{ provinceCount }}개 시·도 중
        <strong class="text-map-visit-high">{{ visitedCount() }}곳</strong>
        · 누적 {{ totalVisits() | number }}곳
      </small>
      <!-- 채운 만큼이 다녀온 시·도 비율. 숫자만으로는 많고 적음을 알 수 없다. -->
      <span
        class="mt-1.5 block h-1.25 overflow-hidden rounded-pill bg-ground-2"
        aria-hidden="true"
      >
        <span
          class="block h-full rounded-pill [background:linear-gradient(90deg,var(--color-map-visit-middle),var(--color-map-visit-high))]"
          [style.width.%]="coverage()"
        ></span>
      </span>
    } @else {
      <small class="mt-1 block text-12 leading-normal text-ink-3">
        여행이 끝나면 여기에 쌓여요
      </small>
    }
  </span>

  <app-icon class="flex-none text-ink-3" name="chevron-right" [size]="16" />
</a>
