<form
  class="page mx-auto my-0 flex max-w-(--content-max) flex-col gap-5 p-[var(--sp-4)_var(--sp-4)_calc(var(--sp-6)+80px)] [@media(min-width:_720px)]:p-[var(--sp-4)_var(--sp-6)_calc(var(--sp-6)+80px)]"
  (submit)="send($event)"
  [attr.aria-busy]="sending()"
  novalidate
>
  <fieldset class="m-0 border-0 p-0">
    <legend class="mb-2 p-0 text-13 font-bold">어떤 문의인가요?</legend>
    <div class="grid grid-cols-2 gap-2" role="radiogroup" aria-label="문의 종류">
      @for (k of kinds; track k) {
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="kind() === k"
          class="min-h-11 rounded-control border bg-panel text-13 [transition:border-color_var(--dur)_var(--ease-out)]"
          [class.border-accent]="kind() === k"
          [class.bg-accent-tint]="kind() === k"
          [class.text-accent-deep]="kind() === k"
          [class.font-bold]="kind() === k"
          [class.border-border]="kind() !== k"
          (click)="pick(k)"
          [attr.data-testid]="'kind-' + k"
        >
          {{ kindLabel[k] }}
        </button>
      }
    </div>
  </fieldset>

  <div>
    <label class="mb-2 block text-13 font-bold" for="inquiry-body">문의 내용</label>
    <textarea
      appInput
      id="inquiry-body"
      #bodyInput
      class="min-h-40 w-full resize-y py-3"
      [value]="body()"
      (input)="body.set(bodyInput.value)"
      [attr.maxlength]="bodyMax"
      placeholder="무엇이 불편하셨는지 알려주세요."
      [disabled]="sending()"
      data-testid="inquiry-body"
    ></textarea>
    <p class="mt-1.5 text-right text-12 text-hint [font-variant-numeric:tabular-nums]">
      {{ body().length }} / {{ bodyMax }}
    </p>
  </div>

  <!--
    무엇이 함께 남는지 미리 알린다. 오류 신고에서 기기를 다시 묻지 않으려고 버전과
    기기 정보를 붙인다. 서버에 연결되기 전에는 운영자에게 가지 않는다는 것도 적는다.
    전달되지 않는데 '전달된다'고 쓰면 답을 기다리게 된다(2026-09-30 감리 P2-01).
  -->
  <p class="rounded-panel bg-panel px-4 py-3 text-12 leading-relaxed text-ink-3 shadow-panel" data-testid="inquiry-delivery-note">
    @if (delivers) {
      답변은 문의하기 목록에서 확인할 수 있어요. 앱 버전과 기기 정보가 함께 전달됩니다.
    } @else {
      지금은 문의가 이 기기에만 저장되고 운영자에게 전달되지 않아요. 앱 버전과 기기 정보가 함께 기록됩니다.
    }
  </p>

  @if (error(); as message) {
    <div appNotice tone="danger" role="alert" data-testid="inquiry-send-error">{{ message }}</div>
  }

  <div appActionBar class="action-bar">
    <div class="action-bar__inner mx-auto my-0 flex max-w-(--content-max) gap-2">
      <button
        appButton
        type="submit"
        variant="primary"
        class="btn"
        [disabled]="!canSend()"
        [loading]="sending()"
        data-testid="inquiry-send"
      >
        보내기
      </button>
    </div>
  </div>
</form>
