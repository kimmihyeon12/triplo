<form
  class="page mx-auto my-0 flex max-w-(--content-max) flex-col gap-3 p-[var(--sp-4)_var(--sp-4)_calc(var(--sp-6)+80px)] [@media(min-width:_720px)]:p-[var(--sp-4)_var(--sp-6)_calc(var(--sp-6)+80px)]"
  (submit)="send($event)"
  [attr.aria-busy]="sending()"
  novalidate
>
  <!-- 앱의 편집 폼과 같은 흰 카드 하나. 안내는 입력 아래 회색 힌트로 둔다. -->
  <div class="panel flex flex-col rounded-panel bg-panel p-4 shadow-panel">
    <fieldset class="field m-0 mb-4 flex flex-col gap-1 border-0 p-0">
      <legend class="field__label mb-1 p-0 text-13 font-medium text-ink-2">어떤 문의인가요?</legend>
      <div class="grid grid-cols-2 gap-1.5" role="radiogroup" aria-label="문의 종류">
        @for (k of kinds; track k) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="kind() === k"
            class="kind min-h-10 rounded-control border border-border-strong bg-panel text-13 font-medium text-ink-2 [transition:background-color_var(--dur)_var(--ease-out),border-color_var(--dur)_var(--ease-out),color_var(--dur)_var(--ease-out)] hover:border-ink-3 hover:text-ink focus-visible:[outline:2px_solid_var(--color-accent-deep)] focus-visible:outline-offset-2 [&.kind--on]:border-ink [&.kind--on]:bg-ink [&.kind--on]:font-bold [&.kind--on]:text-panel"
            [class.kind--on]="kind() === k"
            (click)="pick(k)"
            [attr.data-testid]="'kind-' + k"
          >
            {{ kindLabel[k] }}
          </button>
        }
      </div>
    </fieldset>

    <!--
      무엇이 함께 남는지 미리 알린다. 오류 신고에서 기기를 다시 묻지 않으려고 버전과
      기기 정보를 붙인다. 서버에 연결되기 전에는 운영자에게 가지 않는다는 것도 적는다.
      전달되지 않는데 '전달된다'고 쓰면 답을 기다리게 된다(2026-09-30 감리 P2-01).
    -->
    <app-field
      label="문의 내용"
      inputId="inquiry-body"
      [hint]="delivers
        ? '답변은 문의하기 목록에서 확인할 수 있어요. 앱 버전과 기기 정보가 함께 전달됩니다.'
        : '지금은 문의가 이 기기에만 저장되고 운영자에게 전달되지 않아요. 앱 버전과 기기 정보가 함께 기록됩니다.'"
      class="mb-0!"
      data-testid="inquiry-delivery-note"
    >
      <textarea
        appInput
        id="inquiry-body"
        #bodyInput
        class="min-h-40 resize-y py-3"
        [value]="body()"
        (input)="body.set(bodyInput.value)"
        [attr.maxlength]="bodyMax"
        aria-describedby="inquiry-body-hint"
        placeholder="무엇이 불편하셨는지 알려주세요."
        [disabled]="sending()"
        data-testid="inquiry-body"
      ></textarea>
      <p class="mt-2 text-right text-12 text-hint [font-variant-numeric:tabular-nums]">
        {{ body().length }} / {{ bodyMax }}
      </p>
    </app-field>
  </div>

  @if (error(); as message) {
    <div appNotice tone="danger" role="alert" data-testid="inquiry-send-error">{{ message }}</div>
  }

  <div appActionBar class="action-bar">
    <div class="action-bar__inner mx-auto my-0 flex max-w-(--content-max) gap-2">
      <button
        appButton
        type="submit"
        variant="primary"
        class="btn"
        [disabled]="!canSend()"
        [loading]="sending()"
        data-testid="inquiry-send"
      >
        보내기
      </button>
    </div>
  </div>
</form>
