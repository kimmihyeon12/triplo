<div
  class="page mx-auto my-0 flex max-w-(--content-max) flex-col gap-3 p-[var(--sp-4)_var(--sp-4)_calc(var(--sp-6)+80px)] [@media(min-width:_720px)]:p-[var(--sp-4)_var(--sp-6)_calc(var(--sp-6)+80px)]"
>
  @if (error(); as message) {
    <div appNotice tone="danger" role="alert" data-testid="notice-detail-error">{{ message }}</div>
  } @else if (notice(); as n) {
    <!-- 목록과 같은 머리 줄: 제목은 왼쪽, 날짜는 오른쪽 끝 -->
    <article class="panel rounded-panel bg-panel p-4 shadow-panel" data-testid="notice-detail">
      <header class="flex items-start gap-2">
        <h2 class="m-0 min-w-0 flex-1 text-16 font-bold leading-snug wrap-anywhere">{{ n.title }}</h2>
        <span class="mt-0.5 flex-none text-12 text-ink-3 [font-variant-numeric:tabular-nums]">{{ day(n.publishedAt ?? n.createdAt) }}</span>
      </header>
      <p class="mt-1.5 whitespace-pre-line text-14 leading-relaxed text-ink-2 wrap-anywhere" data-testid="notice-detail-body">{{ n.body }}</p>
    </article>
  } @else {
    <div class="flex justify-center py-16" role="status" aria-label="공지 불러오는 중">
      <app-spinner />
    </div>
  }
</div>
