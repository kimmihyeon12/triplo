<div
  class="page mx-auto my-0 flex max-w-(--content-max) flex-col gap-3 p-[var(--sp-4)_var(--sp-4)_calc(var(--sp-6)+80px)] [@media(min-width:_720px)]:p-[var(--sp-4)_var(--sp-6)_calc(var(--sp-6)+80px)]"
  [attr.aria-busy]="loading()"
>
  @if (loading()) {
    <div class="flex justify-center py-16" role="status" aria-label="공지사항 불러오는 중">
      <app-spinner />
    </div>
  } @else if (error(); as message) {
    <div appNotice tone="danger" role="alert" data-testid="notices-error">{{ message }}</div>
  } @else if (notices().length === 0) {
    <section class="panel rounded-panel bg-panel p-5 shadow-panel" data-testid="empty-notices">
      <app-empty-state title="아직 공지사항이 없어요" />
    </section>
  } @else {
    <!-- 내 정보 목록과 같은 한 장의 카드. 모두 접어 두고 안 읽은 공지는 제목 옆 점으로 알린다. -->
    <ul class="m-0 list-none rounded-panel bg-panel p-0 shadow-panel" data-testid="notice-list">
      @for (notice of notices(); track notice.id) {
        <li class="border-b border-border last:border-b-0">
          <details class="fold px-4 [[open]]:pb-4">
            <summary
              class="flex min-h-14 cursor-pointer list-none items-start gap-2.5 py-3.5 [&::-webkit-details-marker]:hidden"
            >
              <span class="min-w-0 flex-1">
                <span class="flex items-center gap-1.5 text-14 font-bold leading-snug">
                  <span class="min-w-0">{{ notice.title }}</span>
                  @if (unreadIds().has(notice.id)) {
                    <span class="size-1.5 flex-none rounded-full bg-danger-ink" aria-label="새 공지" data-testid="notice-unread"></span>
                  }
                </span>
                <span class="mt-0.5 block text-12 text-ink-3">{{ day(notice.createdAt) }}</span>
              </span>
              <span
                class="mt-1 flex size-4 flex-none items-center justify-center text-ink-3 [transition:transform_var(--dur)_var(--ease-out)] in-[details[open]]:rotate-90"
                aria-hidden="true"
              >
                <app-icon name="chevron-right" [size]="16" />
              </span>
            </summary>
            <p class="whitespace-pre-line text-13 leading-relaxed text-ink-2">
              {{ notice.body }}
            </p>
          </details>
        </li>
      }
    </ul>
  }
</div>
