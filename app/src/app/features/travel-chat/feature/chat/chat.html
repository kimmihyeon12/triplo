<app-chat-thread
  [messages]="store.messages()"
  [chips]="store.chips()"
  [pending]="store.pending()"
  [error]="store.error()"
  [trip]="store.trip()"
  [appliedMessageId]="appliedMessageId()"
  [dismissedIds]="dismissedIds()"
  [turnsLeft]="store.turnsLeft()"
  (send)="send($event)"
  (apply)="apply($event)"
  (dismissDraft)="dismissDraft($event)"
  (undo)="undo()"
  (cancel)="store.cancel()"
/>

<!--
  담은 뒤에는 만든 여행으로 갈 수 있어야 한다. 대화를 이어 가며 더 담을 수도
  있으므로 화면을 자동으로 넘기지 않고 띠만 띄운다.
-->
@if (savedTripId()) {
  <div
    class="flex flex-none items-center justify-between gap-3 border-t border-border bg-ok-tint px-4 py-3"
    data-testid="chat-saved-bar"
  >
    <p class="min-w-0 flex-1 text-13 font-semibold text-ok-ink">여행에 담았습니다</p>
    <button
      appButton
      class="btn btn--sm"
      type="button"
      variant="primary"
      (click)="goToTrip()"
      data-testid="chat-go-trip"
    >
      여행 보기
    </button>
  </div>
}
