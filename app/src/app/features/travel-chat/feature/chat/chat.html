<!--
  제목과 '새 대화'는 상단 바가 맡는다. 구름이는 대화가 시작되기 전 빈
  화면에서 한 번 인사한다. 전에는 여기 헤더를 하나 더 두어 이 화면만
  머리가 두 겹이었다.
-->
<app-chat-thread
  [messages]="store.messages()"
  [chips]="store.chips()"
  [pending]="store.pending()"
  [error]="store.error()"
  [trip]="store.trip()"
  [appliedMessageId]="appliedMessageId()"
  [dismissedIds]="dismissedIds()"
  [turnsLeft]="store.turnsLeft()"
  (send)="send($event)"
  (apply)="apply($event)"
  (dismissDraft)="dismissDraft($event)"
  (undo)="undo()"
  (cancel)="store.cancel()"
/>
