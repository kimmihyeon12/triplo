<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="topbar">
  <div class="topbar__inner">
    @if (bar().back) {
      <a class="topbar__back" [routerLink]="bar().back" [queryParams]="bar().backQueryParams ?? {}" aria-label="뒤로">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M15 5l-7 7 7 7" />
        </svg>
      </a>
    } @else {
      <a class="topbar__brand" routerLink="/trips" aria-label="트립플로 홈">
        <svg class="topbar__symbol" viewBox="0 0 28 28" fill="none" aria-hidden="true" focusable="false">
          <path
            d="M6.5 7.5C9.8 6.6 14.6 6.2 19.5 6.6M13.2 6.9C12.6 12.4 12.3 16.6 12.6 19.2C12.8 21.1 13.6 21.9 15.1 21.6C16.4 21.3 17.7 20.3 19 18.6"
            stroke="currentColor"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
    }
    <h1 class="topbar__title">{{ bar().title }}</h1>
    @if (bar().action; as act) {
      <a
        class="topbar__action"
        [routerLink]="act.link"
        [queryParams]="act.queryParams ?? {}"
        [attr.aria-label]="act.ariaLabel ?? act.label"
        [attr.data-testid]="act.testId"
      >
        @if (act.icon) {
          <app-icon [name]="act.icon" [size]="18" />
        }
        @if (act.label) {
          <span [class.visually-hidden]="!!act.icon && !act.label">{{ act.label }}</span>
        }
      </a>
    } @else {
      <span class="topbar__spacer" aria-hidden="true"></span>
    }
  </div>
</header>
<main id="main" tabindex="-1">
  <router-outlet />
</main>
