# Netlify 배포 설정.
# 앱은 저장소 루트가 아니라 app/ 아래에 있으므로 base로 작업 위치를 옮긴다.
# publish 경로는 base 기준 상대 경로다.

[build]
  base = "app"
  command = "npm run build:deploy"
  publish = "dist/travel-companion-app/browser"

[build.environment]
  NODE_VERSION = "22"

# 서비스 워커와 설정 파일은 캐시하지 않는다.
# 캐시되면 새 버전을 내보내도 기기에 옛 앱이 남는다.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*-config.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
