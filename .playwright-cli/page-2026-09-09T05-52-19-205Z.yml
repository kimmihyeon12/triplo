        - link "ENTHUSIASM님의 일정 1박2일 인생 첫 군생활 중 2번째 휴가 중 혼자 국내여행 혼자만의 시간을 갖고 싶어 떠난 강릉 여행. 비록 늦잠자서 버스도 놓치고 길도 헷갈리는 등 여러 우여곡절이 있었지만 하고 싶었던 맛있는 거 먹는 것도 하고 혼자서 숙소에서 맥주도 마시고 산책도 하면서 힐링의 시간을 가질 수 있었다.물론 혼자이기에 가끔씩 외롭다고 느낄 때도 있었지만 선택의 순간에서 책임의 무계에서 자유로울 수 있었고 쉬운 계획 변동도 가능했다.이번 여행을 계기로 1박2일 국내여행을 자주 갈 것 같다. 군생활에서의 스트레스가 많은 상황이었는데 혼자 30~40분 걷고 군대도 집도 아닌 새로운 곳에서 혼자 길을 걷고 있는 것이 개방감을 얻으며 생각을 정리할 시간을 가질 수 있었다. -20대 남자의 첫 1박2일 강릉 여행기-" [ref=e749] [cursor=pointer]:
