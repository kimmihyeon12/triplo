<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배너 섬네일 대안</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#fbfbfa; --ground-2:#f0f0ee; --panel:#fff;
  --ink:#16181d; --ink-2:#4a4f58; --ink-3:#6b7280;
  --border:#e8eaef; --border-strong:#d4d8e0;
  --accent-deep:#2f5fdb; --accent-tint:#eaf0fe;
  --map-land:#fcfdfe; --map-water:#dcecfa; --map-water-light:#f0f8ff;
  --visit-low:#c9eaf0; --visit-mid:#3fb3c9; --visit-high:#0d5563;
  --shadow:0 0 0 1px rgba(28,25,23,.05), 0 2px 10px rgba(28,25,23,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:36px 20px 70px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
.lede{margin:9px 0 0;font-size:13.5px;line-height:1.75;color:var(--ink-2);max-width:74ch}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));margin-top:30px}
.opt{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column}
.opt .tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--ground-2);color:var(--ink-2)}
.opt .tag.best{background:var(--accent-deep);color:#fff}
.opt h2{font-size:15.5px;font-weight:700;margin:9px 0 0}
.opt p.why{margin:6px 0 12px;font-size:12.5px;line-height:1.65;color:var(--ink-2)}

/* 실제 배너와 같은 맥락에서 본다 */
.banner{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;
  background:var(--panel);box-shadow:var(--shadow);border:1px solid transparent;
}
.banner .thumb{
  width:76px;height:58px;flex:none;border-radius:10px;overflow:hidden;
  background:var(--map-water);
  background-image:radial-gradient(ellipse at 50% 25%,var(--map-water-light),var(--map-water));
  display:flex;align-items:center;justify-content:center;
}
.banner .thumb.plain{background:var(--ground-2);background-image:none}
.banner .thumb svg{width:100%;height:100%;display:block}
.banner .txt{min-width:0;flex:1}
.banner .txt b{display:block;font-size:14.5px;font-weight:700}
.banner .txt small{display:block;margin-top:4px;font-size:12px;color:var(--ink-3)}
.banner .bar{display:block;height:5px;margin-top:7px;border-radius:999px;background:var(--ground-2);overflow:hidden}
.banner .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--visit-mid),var(--visit-high))}
.banner .go{color:var(--ink-3);flex:none}

/* 확대해서 형태를 본다 */
.zoom{
  margin-top:12px;height:150px;border-radius:12px;overflow:hidden;
  background:var(--map-water);
  background-image:radial-gradient(ellipse at 50% 25%,var(--map-water-light),var(--map-water));
}
.zoom.plain{background:var(--ground-2);background-image:none}
.zoom svg{width:100%;height:100%;display:block}
.note{margin:11px 0 0;font-size:12px;line-height:1.7;color:var(--ink-3)}
.note b{color:var(--ink-2);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>배너 섬네일 대안</h1>
  <p class="lede">현재 섬네일은 격자가 성기고 블록이 뭉툭해 한반도로 읽히지 않습니다. 아래는 같은 자리에 들어갈 대안이며, 위는 실제 배너 크기, 아래는 형태를 보기 위해 확대한 모습입니다.</p>

  <div class="grid" id="grid"></div>
</div>

<script>
const CELLS=[[2,0,'gyeonggi'],[3,0,'gyeonggi'],[2,1,'incheon'],[3,1,'seoul'],[4,1,'gyeonggi'],
  [3,2,'gyeonggi'],[4,2,'gyeonggi'],[4,0,'gangwon'],[5,0,'gangwon'],[6,0,'gangwon'],
  [5,1,'gangwon'],[6,1,'gangwon'],[3,3,'chungnam'],[4,3,'sejong'],[5,2,'chungbuk'],
  [2,3,'chungnam'],[5,3,'chungbuk'],[4,4,'daejeon'],[6,2,'gyeongbuk'],[7,1,'gyeongbuk'],
  [7,2,'gyeongbuk'],[6,3,'gyeongbuk'],[7,3,'daegu'],[2,4,'jeonbuk'],[3,4,'jeonbuk'],
  [2,5,'jeonnam'],[3,5,'gwangju'],[4,5,'jeonnam'],[3,6,'jeonnam'],[5,4,'gyeongnam'],
  [6,4,'gyeongnam'],[7,4,'ulsan'],[5,5,'gyeongnam'],[6,5,'busan'],[3,8,'jeju']];

const DATA={seoul:12,gyeonggi:4,busan:5,jeju:7,gangwon:3,jeonnam:2};

const LOW='#c9eaf0',MID='#3fb3c9',HIGH='#0d5563',LAND='#fcfdfe';
const ch=(h,i)=>parseInt(h.slice(i,i+2),16);
const mix=(a,b,t)=>'#'+[1,3,5].map(i=>Math.round(ch(a,i)*(1-t)+ch(b,i)*t).toString(16).padStart(2,'0')).join('');
const dark=(h,f)=>'#'+[1,3,5].map(i=>Math.round(Math.min(255,ch(h,i)*f)).toString(16).padStart(2,'0')).join('');
const STEPS=[1,3,6,11,21];
const level=n=>n<=0?0:STEPS.filter(s=>n>=s).length;
const tone=t=>t<=.5?mix(LOW,MID,t*2):mix(MID,HIGH,(t-.5)*2);
const pts=a=>a.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');

/* ── A. 현재안 (비교용) ───────────────────────── */
function drawCurrent(){
  const RX=8.2,RY=4.6,SX=7.3,SY=4.2,LV=1.4;
  let out='';
  for(const [q,r,reg] of [...CELLS].sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]))){
    const lv=level(DATA[reg]||0), h=lv?2+lv*LV:0;
    const x=(q-r)*SX, y=(q+r)*SY-h;
    const fill=lv?tone((lv-1)/4):LAND;
    const top=[[x,y-RY],[x+RX,y-RY/2],[x+RX,y+RY/2],[x,y+RY],[x-RX,y+RY/2],[x-RX,y-RY/2]];
    if(h) out+=`<polygon points="${pts([[x-RX,y+RY/2],[x,y+RY],[x,y+RY+h],[x-RX,y+RY/2+h]])}" fill="${dark(fill,.8)}"/>`
             +`<polygon points="${pts([[x,y+RY],[x+RX,y+RY/2],[x+RX,y+RY/2+h],[x,y+RY+h]])}" fill="${dark(fill,.9)}"/>`;
    out+=`<polygon points="${pts(top)}" fill="${fill}"${lv?'':' stroke="#cfe2ef" stroke-width="0.6"'}/>`;
  }
  return `<svg viewBox="-62 -18 124 88">${out}</svg>`;
}

/* ── B. 촘촘한 격자 + 또렷한 블록 ─────────────── */
function drawTight(){
  /* 칸을 키우고 간격을 좁혀 덩어리로 붙게 한다. 블록은 더 높여 입체감을 살린다. */
  const RX=9.4,RY=5.3,SX=8.2,SY=4.7,LV=2.6;
  let out='';
  for(const [q,r,reg] of [...CELLS].sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]))){
    const lv=level(DATA[reg]||0), h=lv?2.5+lv*LV:0;
    const x=(q-r)*SX, y=(q+r)*SY-h;
    const fill=lv?tone((lv-1)/4):LAND;
    const top=[[x,y-RY],[x+RX,y-RY/2],[x+RX,y+RY/2],[x,y+RY],[x-RX,y+RY/2],[x-RX,y-RY/2]];
    if(h) out+=`<polygon points="${pts([[x-RX,y+RY/2],[x,y+RY],[x,y+RY+h],[x-RX,y+RY/2+h]])}" fill="${dark(fill,.74)}"/>`
             +`<polygon points="${pts([[x,y+RY],[x+RX,y+RY/2],[x+RX,y+RY/2+h],[x,y+RY+h]])}" fill="${dark(fill,.87)}"/>`;
    out+=`<polygon points="${pts(top)}" fill="${fill}"/>`;
  }
  return `<svg viewBox="-70 -24 140 98">${out}</svg>`;
}

/* ── C. 한반도 실루엣 + 방문 점 ───────────────── */
function drawSilhouette(){
  /*
    격자를 버리고 남한 윤곽 하나로 그린 뒤 방문 지역에 점을 찍는다.
    76×58처럼 작은 자리에서는 칸을 세는 것보다 형태가 먼저 읽힌다.

    좌표는 실제 경계가 아니라 형태만 따온 것이다. 저장하는 값이 아니라
    장식이므로 정확한 경계를 쓰지 않는다.
  */
  const path=
    'M30 4 C34 4 37 6 39 9 C41 12 44 13 47 15 C50 17 51 20 50 23 '
    +'C49 26 50 29 52 32 C54 35 55 39 54 43 C53 47 50 50 48 54 '
    +'C46 58 45 62 43 66 C41 70 38 73 34 74 C30 75 26 74 23 71 '
    +'C20 68 19 64 19 60 C19 56 17 53 14 51 C11 49 9 46 9 42 '
    +'C9 38 11 35 12 31 C13 27 12 23 13 19 C14 15 17 11 21 8 '
    +'C24 6 27 4 30 4 Z';
  /* 서울·경기, 강원, 부산, 제주, 전남을 대략의 자리에 둔다. */
  const dots=[
    {x:26,y:22,n:12},{x:35,y:17,n:4},{x:40,y:55,n:5},
    {x:23,y:86,n:7},{x:24,y:64,n:2},{x:44,y:24,n:3},
  ];
  let out=`<path d="${path}" fill="${LAND}" stroke="#b3d4e6" stroke-width="1.3" stroke-linejoin="round"/>`;
  // 제주는 본토와 떨어진 섬이므로 따로 그린다.
  out+=`<ellipse cx="23" cy="86" rx="7.5" ry="4.6" fill="${LAND}" stroke="#b3d4e6" stroke-width="1.3"/>`;
  for(const d of dots){
    const lv=level(d.n), t=(lv-1)/4, r=2.4+t*3.4;
    out+=`<circle cx="${d.x}" cy="${d.y}" r="${(r+1.8).toFixed(1)}" fill="${tone(t)}" opacity=".25"/>`
       + `<circle cx="${d.x}" cy="${d.y}" r="${r.toFixed(1)}" fill="${tone(t)}"/>`;
  }
  return `<svg viewBox="4 0 56 94">${out}</svg>`;
}

/* ── D. 지도 핀 심볼 ──────────────────────────── */
function drawPin(){
  /*
    지도를 재현하지 않고 기호 하나로 둔다. 작은 자리에서 가장 또렷하지만
    '어디를 다녀왔는지'라는 정보는 담지 못한다.
  */
  return `<svg viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="19" fill="#ffffff" opacity=".65"/>
    <path d="M24 39s-10-11.5-10-17a10 10 0 0 1 20 0c0 5.5-10 17-10 17Z"
      fill="${HIGH}"/>
    <circle cx="24" cy="21.5" r="4.2" fill="#ffffff"/>
  </svg>`;
}

/* ── E. 겹친 블록 무더기 ──────────────────────── */
function drawStackMark(){
  /*
    지리를 버리고 '기록이 쌓인다'는 뜻만 블록 세 단으로 남긴다.
    데이터와 무관하므로 어떤 상태에서도 같은 모습이다.
  */
  const cell=(cx,cy,h,fill)=>{
    const RX=13,RY=7.4;
    const top=[[cx,cy-RY],[cx+RX,cy-RY/2],[cx+RX,cy+RY/2],[cx,cy+RY],[cx-RX,cy+RY/2],[cx-RX,cy-RY/2]];
    return `<polygon points="${pts([[cx-RX,cy+RY/2],[cx,cy+RY],[cx,cy+RY+h],[cx-RX,cy+RY/2+h]])}" fill="${dark(fill,.74)}"/>`
         + `<polygon points="${pts([[cx,cy+RY],[cx+RX,cy+RY/2],[cx+RX,cy+RY/2+h],[cx,cy+RY+h]])}" fill="${dark(fill,.87)}"/>`
         + `<polygon points="${pts(top)}" fill="${fill}"/>`;
  };
  return `<svg viewBox="-34 -26 68 62">`
    + cell(-13,10,7,LOW) + cell(13,10,7,mix(LOW,MID,.6))
    + cell(0,2,13,HIGH)
    + `</svg>`;
}

const OPTS=[
  {tag:'현재', title:'A · 지금 들어간 섬네일', best:false,
   why:'칸이 작고 사이가 벌어져 한반도 덩어리로 붙지 않습니다. 블록 높이도 낮아 입체로 읽히지 않습니다.',
   svg:drawCurrent(), plain:false,
   note:'<b>문제</b> 76×58 크기에서 격자 35칸을 다 그리려니 칸 하나가 너무 작아졌습니다.'},
  {tag:'대안', title:'B · 촘촘한 격자 · 또렷한 블록', best:false,
   why:'칸을 키우고 간격을 좁혀 덩어리로 붙게 했습니다. 블록도 더 높였습니다.',
   svg:drawTight(), plain:false,
   note:'<b>결과</b> 확대하면 나아 보이지만 정작 배너 크기에서는 A안보다 더 어수선합니다. 격자 35칸은 이 자리에 너무 많습니다.'},
  {tag:'추천', title:'C · 한반도 실루엣 · 방문 점', best:true,
   why:'격자를 버리고 윤곽 하나로 그린 뒤 방문 지역에 점을 찍습니다. 작은 크기에서 형태가 바로 읽힙니다.',
   svg:drawSilhouette(), plain:false,
   note:'<b>좋은 점</b> 배너 크기에서 유일하게 지도로 읽힙니다. 방문 지역의 위치와 세기도 점 크기·색으로 담깁니다.<br><b>치를 값</b> 지도 화면은 육각 격자인데 배너만 실루엣이라 형태가 다릅니다. 다만 배너는 미리보기이지 축소판이 아니므로 감수할 만합니다.'},
  {tag:'최소', title:'D · 지도 핀 심볼', best:false,
   why:'지도를 재현하지 않고 기호 하나만 둡니다. 어떤 크기에서도 또렷합니다.',
   svg:drawPin(), plain:false,
   note:'<b>치를 값</b> ‘어디를 다녀왔는지’가 전혀 담기지 않아 배너를 누를 이유가 옆의 숫자에만 남습니다.'},
  {tag:'대안', title:'E · 블록 무더기', best:false,
   why:'지리를 버리고 ‘기록이 쌓인다’는 뜻만 블록 세 단으로 남깁니다.',
   svg:drawStackMark(), plain:true,
   note:'<b>치를 값</b> 데이터와 무관해 어떤 상태에서도 같은 모습입니다. 바다 배경도 어울리지 않아 회색 바탕을 씁니다.'},
];

const grid=document.getElementById('grid');
for(const o of OPTS){
  const el=document.createElement('section');
  el.className='opt';
  el.innerHTML=`
    <span class="tag ${o.best?'best':''}">${o.tag}</span>
    <h2>${o.title}</h2>
    <p class="why">${o.why}</p>
    <div class="banner">
      <span class="thumb ${o.plain?'plain':''}">${o.svg}</span>
      <span class="txt">
        <b>다녀온 곳 지도</b>
        <small>17개 시·도 중 <strong style="color:var(--visit-high)">6곳</strong> · 누적 33회</small>
        <span class="bar"><i style="width:35%"></i></span>
      </span>
      <span class="go">›</span>
    </div>
    <div class="zoom ${o.plain?'plain':''}">${o.svg}</div>
    <p class="note">${o.note}</p>`;
  grid.appendChild(el);
}
</script>
</body>
</html>
