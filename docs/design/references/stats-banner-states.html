<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지도 배너 상태</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#fbfbfa; --ground-2:#f0f0ee; --panel:#ffffff;
  --accent:#3b6fef; --accent-deep:#2f5fdb; --accent-tint:#eaf0fe; --accent-fill:#cfdcfb;
  --map-land:#fcfdfe; --map-water:#dcecfa; --map-water-light:#f0f8ff;
  /* 옅은 단계는 바다에 묻히지 않도록 theme.css 값보다 한 단계 내렸다. */
  --visit-low:#a3dbe8; --visit-mid:#3fb3c9; --visit-high:#0d5563;
  --region-ink:#3f6212; --region-tint:#eaf3dc;
  --place-ink:#2650bd; --place-tint:#eaf0fe;
  --stay-ink:#6a4bb5; --stay-tint:#efe9fb;
  --ink:#16181d; --ink-2:#4a4f58; --ink-3:#6b7280;
  --border:#e8eaef; --border-strong:#d4d8e0;
  --shadow-panel:0 0 0 1px rgba(28,25,23,.05), 0 2px 10px rgba(28,25,23,.07);
  --shadow-float:0 4px 18px rgba(28,25,23,.12);
  --ai-fill:linear-gradient(135deg,#3b6fef 0%,#6d4fd6 100%);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans KR",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px; margin:0 auto; padding:40px 20px 80px}
h1{font-size:25px; font-weight:800; letter-spacing:-.02em; margin:0}
.lede{margin:10px 0 0; font-size:14px; line-height:1.75; color:var(--ink-2); max-width:76ch}
.decided{
  margin:18px 0 0; padding:13px 16px; border-radius:12px; background:var(--accent-tint);
  font-size:13px; line-height:1.8; color:#25407e;
}
.decided b{font-weight:700}

.states{display:grid; gap:30px 26px; margin-top:34px; grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){ .states{grid-template-columns:1fr} }
.state{display:flex; flex-direction:column}
.state > header{margin-bottom:12px}
.tag{
  display:inline-block; font-size:11px; font-weight:800; letter-spacing:.04em;
  padding:4px 10px; border-radius:999px; background:var(--ground-2); color:var(--ink-2);
}
.tag.new{background:var(--accent-deep); color:#fff}
.state h2{font-size:16px; font-weight:700; margin:9px 0 0}
.state .why{margin:6px 0 0; font-size:13px; line-height:1.7; color:var(--ink-2)}
.state .stage{flex:1; display:flex; align-items:flex-start; justify-content:center}

.phone{
  width:100%; max-width:380px; background:var(--ground);
  border:1px solid var(--border-strong); border-radius:24px; overflow:hidden;
  box-shadow:var(--shadow-float);
}
.topbar{
  display:grid; grid-template-columns:44px minmax(0,1fr) auto; align-items:center;
  gap:4px; min-height:50px; padding:0 8px;
  background:var(--panel); border-bottom:1px solid var(--border);
}
.brand{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--accent-deep);font-weight:800;font-size:16px}
.topbar h3{margin:0;font-size:15.5px;font-weight:700;text-align:center}
.avatar{
  width:29px;height:29px;border-radius:999px;background:var(--accent-tint);
  color:var(--accent-deep);font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;justify-self:end;
}
.body{padding:12px 12px 16px;display:flex;flex-direction:column;gap:10px;min-height:400px}
.make{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px;
  border-radius:10px;font-size:12.5px;font-weight:700;
  border:1px solid var(--border-strong);background:var(--panel);color:var(--ink);white-space:nowrap;
}
.btn.ai{background:var(--ai-fill);color:#fff;border-color:transparent}

/* ── 지도 배너 카드 ────────────────────────────── */
.mapcard{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px;
  text-decoration:none; color:inherit; box-shadow:var(--shadow-panel); background:var(--panel);
}
.mapcard .thumb{
  width:76px; height:58px; flex:none; border-radius:10px; overflow:hidden;
  background:var(--map-water);
  background-image:radial-gradient(ellipse at 50% 25%,var(--map-water-light),var(--map-water));
  display:flex; align-items:center; justify-content:center;
}
.mapcard .thumb svg{width:100%;height:100%}
.mapcard .txt{min-width:0;flex:1}
.mapcard .txt b{display:block;font-size:14.5px;font-weight:700}
.mapcard .txt small{display:block;margin-top:4px;font-size:12px;color:var(--ink-3);line-height:1.5}
.mapcard .go{color:var(--ink-3);flex:none}
.mapcard .bar{display:block;height:5px;margin-top:7px;border-radius:999px;background:var(--ground-2);overflow:hidden}
.mapcard .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--visit-mid),var(--visit-high))}
/* 빈 상태는 아직 누를 값이 없으므로 한 톤 가라앉힌다. */
.mapcard.empty{box-shadow:none; border:1px dashed var(--border-strong); background:transparent}
.mapcard.empty .txt b{color:var(--ink-2)}

.rule{display:flex;align-items:center;gap:8px;padding:6px 2px}
.rule i{flex:1;height:1px;background:var(--border)}
.rule span{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--ground-2);border-radius:999px;padding:2px 9px}
.card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-panel);padding:12px}
.card h4{margin:0;font-size:14.5px;font-weight:700}
.card .when{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0;font-size:10.5px}
.chip{border-radius:999px;padding:2px 7px;font-weight:600}
.chip.region{background:var(--region-tint);color:var(--region-ink)}
.chip.place{background:var(--place-tint);color:var(--place-ink)}
.chip.stay{background:var(--stay-tint);color:var(--stay-ink)}
.muted{color:var(--ink-3)}

/* 빈 화면의 두 갈래 카드 */
.emptyhead{display:flex;flex-direction:column;gap:6px;padding:14px 0 2px;text-align:center}
.emptyhead p{margin:0;font-size:12.5px;font-weight:700;color:var(--accent-deep)}
.emptyhead h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.bigcard{
  display:flex;align-items:flex-start;gap:11px;padding:15px;border-radius:14px;
  text-decoration:none;box-shadow:var(--shadow-panel);background:var(--panel);color:inherit;
}
.bigcard.ai{background:var(--ai-fill);color:#fff;box-shadow:var(--shadow-float)}
.bigcard .ico{
  width:36px;height:36px;flex:none;border-radius:10px;display:flex;
  align-items:center;justify-content:center;background:var(--accent-tint);color:var(--accent-deep);
}
.bigcard.ai .ico{background:rgba(255,255,255,.2);color:#fff}
.bigcard b{display:block;font-size:14.5px;font-weight:700}
.bigcard small{display:block;margin-top:3px;font-size:12px;line-height:1.55;color:var(--ink-3)}
.bigcard.ai small{color:rgba(255,255,255,.9)}

.note{
  margin-top:auto; padding:13px 15px; border-radius:12px; background:var(--panel);
  box-shadow:var(--shadow-panel); font-size:12.5px; line-height:1.75; color:var(--ink-2);
}
.note b{color:var(--ink);font-weight:700}
.note code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px;
  background:var(--ground-2); border-radius:5px; padding:1px 5px;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>안 1 · 지도 배너 카드 — 세 가지 상태</h1>
  <p class="lede">여행 목록 맨 위에 들어갈 지도 배너 카드가 상황에 따라 어떻게 보이는지 정리했습니다. 왼쪽부터 여행이 하나도 없을 때, 여행은 있지만 아직 끝난 것이 없을 때, 기록이 쌓였을 때입니다.</p>
  <p class="decided"><b>정해진 것</b> — 옅은 방문색은 <code style="background:rgba(255,255,255,.55);border-radius:5px;padding:1px 5px">#a3dbe8</code>로 내립니다(바다와 명도비 1.06 → 1.26). 그리고 여행이 하나도 없을 때도 배너를 <b>숨기지 않고 빈 상태로 보여 줍니다</b>.</p>

  <div class="states" id="states"></div>
</div>

<script>
/*
  미니 지도. filled가 0이면 방문 블록 없이 흰 지형만 그린다.
  빈 상태에서 초록(청록) 블록을 그리면 없는 기록을 있는 것처럼 보이게 만든다.
*/
function miniMap(filled){
  const cells=[[2,0],[3,0],[2,1],[3,1],[4,1],[3,2],[4,2],[4,0],[5,0],[5,1],
               [3,3],[4,3],[5,2],[2,3],[4,4],[6,2],[6,3],[2,4],[3,4],[2,5],
               [3,5],[3,6],[5,4],[6,4],[5,5],[3,8]];
  /* 방문 지역과 그 세기(0..1). 적게 간 곳은 옅게 칠해 단계가 보이게 한다. */
  const hot={'3,1':1,'2,0':.75,'3,0':.75,'6,4':.5,'3,8':.25,'5,0':.25};
  const mix=(a,b,t)=>{
    const ch=(h,i)=>parseInt(h.slice(i,i+2),16);
    return '#'+[1,3,5].map(i=>Math.round(ch(a,i)*(1-t)+ch(b,i)*t).toString(16).padStart(2,'0')).join('');
  };
  const LOW='#a3dbe8', MID='#3fb3c9', HIGH='#0d5563';
  const tone=t => t<=.5 ? mix(LOW,MID,t*2) : mix(MID,HIGH,(t-.5)*2);
  const dark=(hex,f)=>{
    const ch=i=>Math.round(parseInt(hex.slice(i,i+2),16)*f);
    return '#'+[1,3,5].map(i=>ch(i).toString(16).padStart(2,'0')).join('');
  };
  let out='';
  for(const [q,r] of [...cells].sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]))){
    const key=q+','+r;
    const t = filled ? hot[key] : undefined;
    const on = t!==undefined;
    const h = on ? 3+t*4 : 0;
    const cy = q!==undefined ? (q+r)*4.2 - h : 0;
    const x=(q-r)*7.3;
    const fill = on ? tone(t) : '#ffffff';
    const pts=[[x,cy-4.6],[x+8.2,cy-2.3],[x+8.2,cy+2.3],[x,cy+4.6],[x-8.2,cy+2.3],[x-8.2,cy-2.3]]
      .map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    if(h) out+=`<polygon points="${x-8.2},${(cy+2.3).toFixed(1)} ${x},${(cy+4.6).toFixed(1)} ${x},${(cy+4.6+h).toFixed(1)} ${x-8.2},${(cy+2.3+h).toFixed(1)}" fill="${dark(fill,.72)}"/>`
             + `<polygon points="${x},${(cy+4.6).toFixed(1)} ${x+8.2},${(cy+2.3).toFixed(1)} ${x+8.2},${(cy+2.3+h).toFixed(1)} ${x},${(cy+4.6+h).toFixed(1)}" fill="${dark(fill,.86)}"/>`;
    /*
      빈 상태에서는 흰 지형이 옅은 바다 위에서 한 덩어리로 뭉쳐 형태가 사라진다.
      칸 경계를 옅은 선으로 그어 격자와 한반도 윤곽이 읽히게 한다.
    */
    const edge = on ? '' : ' stroke="#cfe2ef" stroke-width="0.6"';
    out+=`<polygon points="${pts}" fill="${fill}"${edge}/>`;
  }
  return `<svg viewBox="-62 -18 124 88" preserveAspectRatio="xMidYMid meet">${out}</svg>`;
}

const ICON={
  plus:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  plusbig:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  sparkle:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 13.8 9 20 11l-6.2 2L12 19.5 10.2 13 4 11l6.2-2L12 2.5Z"/></svg>',
  sparklebig:'<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 13.8 9 20 11l-6.2 2L12 19.5 10.2 13 4 11l6.2-2L12 2.5Z"/></svg>',
  chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
};

function topbar(){
  return `<div class="topbar"><div class="brand">T</div><h3>내 여행</h3><div class="avatar">나</div></div>`;
}
function makeRow(){
  return `<nav class="make">
    <a class="btn ai">${ICON.sparkle} AI 일정 만들기</a>
    <a class="btn">${ICON.plus} 직접 만들기</a>
  </nav>`;
}
function banner(kind){
  if(kind==='empty') return `
    <a class="mapcard empty">
      <span class="thumb">${miniMap(false)}</span>
      <span class="txt">
        <b>다녀온 곳 지도</b>
        <small>여행이 끝나면 여기에 쌓여요</small>
      </span>
      <span class="go">${ICON.chev}</span>
    </a>`;
  if(kind==='pending') return `
    <a class="mapcard empty">
      <span class="thumb">${miniMap(false)}</span>
      <span class="txt">
        <b>다녀온 곳 지도</b>
        <small>첫 여행이 끝나면 지도가 채워져요</small>
      </span>
      <span class="go">${ICON.chev}</span>
    </a>`;
  return `
    <a class="mapcard">
      <span class="thumb">${miniMap(true)}</span>
      <span class="txt">
        <b>다녀온 곳 지도</b>
        <small>17개 시·도 중 <strong style="color:var(--visit-high)">6곳</strong> · 누적 34회</small>
        <span class="bar" aria-hidden="true"><i style="width:35%"></i></span>
      </span>
      <span class="go">${ICON.chev}</span>
    </a>`;
}

const STATES=[
  {
    tag:'새로 생김', isNew:true, title:'상태 A · 여행이 하나도 없을 때',
    why:'지금은 이 자리에 아무것도 없습니다. 배너를 점선 테두리의 가라앉은 모습으로 두어, 기능이 있다는 사실은 알리되 두 갈래 만들기 카드보다 뒤에 서게 합니다.',
    note:'<b>섬네일</b> 방문 블록 없이 흰 지형만 그립니다. 기록이 없는데 청록 블록을 그리면 없는 기록을 있는 것처럼 보이게 만듭니다.<br><b>눌렀을 때</b> <code>/stats</code>의 빈 상태 화면으로 갑니다. 그 화면은 이미 ‘첫 방문 기록을 기다리고 있어요’ 문구를 갖고 있습니다.',
    render: () => `
      <div class="phone">
        ${topbar()}
        <div class="body">
          <div class="emptyhead"><p>첫 여행</p><h2>어떻게 시작할까요</h2></div>
          <a class="bigcard ai">
            <span class="ico">${ICON.sparklebig}</span>
            <span><b>AI가 초안을 짜 드려요</b><small>지역과 날짜만 고르면 하루 흐름까지 만들어 줍니다</small></span>
          </a>
          <a class="bigcard">
            <span class="ico">${ICON.plusbig}</span>
            <span><b>직접 만들래요</b><small>이름만 적고 빈 일정부터 시작합니다</small></span>
          </a>
          ${banner('empty')}
        </div>
      </div>`,
  },
  {
    tag:'경계', title:'상태 B · 여행은 있지만 아직 안 끝남',
    why:'다가올 여행만 있고 종료된 여행이 없는 상태입니다. 지도에 쌓인 기록이 아직 0이므로 숫자 대신 언제 채워지는지를 알려 줍니다.',
    note:'<b>왜 따로 두나</b> 지도는 <b>종료일이 지난</b> 여행만 셉니다. 여행 카드가 보이는데 지도가 비어 있으면 고장으로 읽히므로, 문구로 이유를 미리 말해 둡니다.<br><b>구분 기준</b> 누적 방문 횟수가 0인지로 판단합니다.',
    render: () => `
      <div class="phone">
        ${topbar()}
        <div class="body">
          ${makeRow()}
          ${banner('pending')}
          <div class="rule"><i></i><span>D-12</span><i></i></div>
          <div class="card">
            <h4>제주 3박 4일</h4>
            <p class="when">10월 2일 – 10월 5일</p>
            <p class="meta"><span class="chip region">제주</span><span class="chip place">장소 8</span><span class="chip stay">숙소 2</span><span class="muted">지출 미설정</span></p>
          </div>
        </div>
      </div>`,
  },
  {
    tag:'평상시', title:'상태 C · 기록이 쌓였을 때',
    why:'앞서 보신 모습입니다. 섬네일·누적 숫자·진행 막대가 모두 채워져, 지도에 들어갈 이유가 카드 안에서 바로 읽힙니다.',
    note:'<b>진행 막대</b> 채운 만큼이 다녀온 시·도 비율입니다. ‘6곳’이라는 숫자만으로는 많은지 적은지 알 수 없으므로 막대가 그 감각을 대신합니다.<br><b>섬네일</b> 실제 방문 분포를 축소해 그리므로 어느 쪽을 많이 다녔는지 미리 보입니다.',
    render: () => `
      <div class="phone">
        ${topbar()}
        <div class="body">
          ${makeRow()}
          ${banner('filled')}
          <div class="rule"><i></i><span>D-12</span><i></i></div>
          <div class="card">
            <h4>제주 3박 4일</h4>
            <p class="when">10월 2일 – 10월 5일</p>
            <p class="meta"><span class="chip region">제주</span><span class="chip place">장소 8</span><span class="chip stay">숙소 2</span><span class="muted">지출 미설정</span></p>
          </div>
          <div class="rule"><i></i><span>다녀옴</span><i></i></div>
          <div class="card">
            <h4>부산 주말 여행</h4>
            <p class="when">8월 16일 – 8월 17일</p>
            <p class="meta"><span class="chip region">부산</span><span class="chip place">장소 5</span><span class="chip stay">숙소 1</span><span class="muted">지출 미설정</span></p>
          </div>
        </div>
      </div>`,
  },
];

const host=document.getElementById('states');
for(const s of STATES){
  const el=document.createElement('section');
  el.className='state';
  el.innerHTML=`
    <header>
      <span class="tag ${s.isNew?'new':''}">${s.tag}</span>
      <h2>${s.title}</h2>
      <p class="why">${s.why}</p>
    </header>
    <div class="stage">${s.render()}</div>
    <p class="note">${s.note}</p>`;
  host.appendChild(el);
}
</script>
</body>
</html>
