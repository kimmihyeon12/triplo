<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방문 지도 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#fbfbfa; --ground-2:#f0f0ee; --panel:#ffffff;
  --accent:#3b6fef; --accent-deep:#2f5fdb; --accent-tint:#eaf0fe;
  --map-land:#fcfdfe; --map-water:#dcecfa; --map-water-light:#f0f8ff;
  /*
    옅은 단계는 theme.css의 #c9eaf0이 아니라 한 단계 내린 값이다.
    #c9eaf0은 바다(#dcecfa)와 명도비가 1.06이라 1~2회 방문 지역이 바다에 묻힌다.
  */
  --visit-low:#a3dbe8; --visit-mid:#3fb3c9; --visit-high:#0d5563;
  --ink:#16181d; --ink-2:#4a4f58; --ink-3:#6b7280;
  --border:#e8eaef; --border-strong:#d4d8e0;
  --radius-panel:16px; --radius-control:10px;
  --shadow-panel:0 0 0 1px rgba(28,25,23,.05), 0 2px 10px rgba(28,25,23,.07);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ground:#101217; --ground-2:#181b22; --panel:#191d25;
    --map-land:#39404d; --map-water:#10212f; --map-water-light:#16304a;
    --visit-low:#2a6b7c; --visit-mid:#3fb3c9; --visit-high:#9fe8f5;
    --ink:#eef1f6; --ink-2:#aab2c0; --ink-3:#8b93a2;
    --border:#2a2f3a; --border-strong:#39404d;
    --accent-tint:#1d2740;
  }
}
:root[data-theme="dark"]{
  --ground:#101217; --ground-2:#181b22; --panel:#191d25;
  --map-land:#39404d; --map-water:#10212f; --map-water-light:#16304a;
  --visit-low:#2a6b7c; --visit-mid:#3fb3c9; --visit-high:#9fe8f5;
  --ink:#eef1f6; --ink-2:#aab2c0; --ink-3:#8b93a2;
  --border:#2a2f3a; --border-strong:#39404d;
  --accent-tint:#1d2740;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:40px 16px 72px}
header.page{margin-bottom:8px}
h1{font-size:26px; font-weight:700; letter-spacing:-.02em; margin:0}
.lede{margin:10px 0 0; color:var(--ink-2); font-size:14px; line-height:1.75; max-width:70ch}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:22px 0 28px}
.toolbar button{
  font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  background:var(--panel); color:var(--ink); border:1px solid var(--border-strong);
  border-radius:999px; padding:8px 15px; min-height:38px;
}
.toolbar button[aria-pressed="true"]{background:var(--accent-deep); border-color:var(--accent-deep); color:#fff}
.grid{display:grid; gap:24px; grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{
  background:var(--panel); border-radius:var(--radius-panel); box-shadow:var(--shadow-panel);
  overflow:hidden; display:flex; flex-direction:column;
}
.card > figcaption{padding:16px 18px 0}
.badge{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em;
  color:var(--accent-deep); background:var(--accent-tint); border-radius:999px; padding:4px 10px;
}
.card h2{font-size:17px; font-weight:700; margin:10px 0 0; letter-spacing:-.01em}
.card p.desc{margin:7px 0 0; font-size:13px; line-height:1.7; color:var(--ink-2)}
.stage{
  position:relative; margin:14px 0 0; height:300px; overflow:hidden;
  background:var(--map-water);
  background-image:radial-gradient(ellipse at 48% 22%, var(--map-water-light), var(--map-water));
}
.stage svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.note{
  border-top:1px solid var(--border); margin-top:auto;
  padding:12px 18px 14px; font-size:12px; line-height:1.65; color:var(--ink-3);
}
.note strong{color:var(--ink-2); font-weight:600}
.pin{
  position:absolute; transform:translate(-50%,-100%);
  display:flex; align-items:center; gap:6px; pointer-events:none;
}
.pin span{
  background:var(--panel); border-radius:8px; padding:3px 8px;
  font-size:11px; font-weight:600; box-shadow:var(--shadow-panel); white-space:nowrap;
}
.legend{display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--border)}
.legend .bar{display:flex; flex:1; height:8px; border-radius:999px; overflow:hidden}
.legend .bar i{flex:1}
.legend small{font-size:11px; color:var(--ink-3); white-space:nowrap}
@media (max-width:520px){ .wrap{padding:28px 16px 56px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>방문 지도 시안 6종</h1>
    <p class="lede">통계 페이지의 입체 방문 지도를 여섯 가지 방향으로 그려 본 비교안입니다. 여섯 시안 모두 같은 시·도 격자와 같은 방문 횟수 데이터를 사용하므로, 표현 방식만 비교하면 됩니다. 현재 구현은 1번 시안에 가장 가깝습니다.</p>
  </header>

  <div class="toolbar" role="group" aria-label="보기 설정">
    <button type="button" id="themeToggle" aria-pressed="false">다크 모드로 보기</button>
    <button type="button" id="dataToggle" aria-pressed="false">데이터 바꿔 보기</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
/* ── 시·도 육각 격자. 프로젝트의 korea-grid.ts와 같은 배치 ───────────── */
const CELLS = [
  [2,0,'gyeonggi'],[3,0,'gyeonggi'],
  [2,1,'incheon'],[3,1,'seoul'],[4,1,'gyeonggi'],
  [3,2,'gyeonggi'],[4,2,'gyeonggi'],
  [4,0,'gangwon'],[5,0,'gangwon'],[6,0,'gangwon'],
  [5,1,'gangwon'],[6,1,'gangwon'],
  [3,3,'chungnam'],[4,3,'sejong'],[5,2,'chungbuk'],
  [2,3,'chungnam'],[5,3,'chungbuk'],[4,4,'daejeon'],
  [6,2,'gyeongbuk'],[7,1,'gyeongbuk'],[7,2,'gyeongbuk'],
  [6,3,'gyeongbuk'],[7,3,'daegu'],
  [2,4,'jeonbuk'],[3,4,'jeonbuk'],
  [2,5,'jeonnam'],[3,5,'gwangju'],[4,5,'jeonnam'],
  [3,6,'jeonnam'],
  [5,4,'gyeongnam'],[6,4,'gyeongnam'],[7,4,'ulsan'],
  [5,5,'gyeongnam'],[6,5,'busan'],
  [3,8,'jeju'],
].map(([q,r,region])=>({q,r,region}));

const NAMES = {
  seoul:'서울', incheon:'인천', gyeonggi:'경기', gangwon:'강원',
  chungbuk:'충북', chungnam:'충남', sejong:'세종', daejeon:'대전',
  gyeongbuk:'경북', daegu:'대구', jeonbuk:'전북', jeonnam:'전남',
  gwangju:'광주', gyeongnam:'경남', busan:'부산', ulsan:'울산', jeju:'제주',
};

const DATASETS = [
  { seoul:34, gyeonggi:21, busan:12, jeju:9, gangwon:8, gyeongbuk:5,
    incheon:4, jeonnam:3, chungnam:2, daegu:2, gyeongnam:1, daejeon:1 },
  { seoul:11, busan:18, jeju:24, gangwon:15, jeonnam:12, gyeongnam:9,
    gyeongbuk:6, chungbuk:4, gwangju:3, ulsan:2, incheon:1 },
];
let data = DATASETS[0];
const maxOf = d => Math.max(1, ...Object.values(d));

/* ── 좌표 ─────────────────────────────────────────────────────────── */
const HEX = { rx:17, ry:9.6, stepX:14.6, stepY:8.4, level:7.4 };
const center = (q,r)=>({ x:(q-r)*HEX.stepX, y:(q+r)*HEX.stepY });
const corners = (cx,cy)=>[
  [cx,cy-HEX.ry],[cx+HEX.rx,cy-HEX.ry/2],[cx+HEX.rx,cy+HEX.ry/2],
  [cx,cy+HEX.ry],[cx-HEX.rx,cy+HEX.ry/2],[cx-HEX.rx,cy-HEX.ry/2],
];
const poly = pts => pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');

function level(count,max){
  if(!count) return 0;
  return Math.max(1, Math.ceil(Math.min(count/max,1)*5));
}

/* 방문 강도 0..1 → 초록 그라디언트 */
function mix(a,b,t){
  const ch=(h,i)=>parseInt(h.slice(i,i+2),16);
  return '#'+[1,3,5].map(i=>Math.round(ch(a,i)*(1-t)+ch(b,i)*t).toString(16).padStart(2,'0')).join('');
}
function cssVar(name){ return getComputedStyle(document.body).getPropertyValue(name).trim(); }
function visitColor(t){
  const low=cssVar('--visit-low'), mid=cssVar('--visit-mid'), high=cssVar('--visit-high');
  return t<=.5 ? mix(low,mid,t*2) : mix(mid,high,(t-.5)*2);
}
const shade = (hex,f)=>{
  const ch=(i)=>Math.round(Math.min(255,parseInt(hex.slice(i,i+2),16)*f));
  return '#'+[1,3,5].map(i=>ch(i).toString(16).padStart(2,'0')).join('');
};

/* ── 시안 정의 ────────────────────────────────────────────────────── */
const CONCEPTS = [
  {
    id:'stack', tag:'시안 1', title:'현재안 · 청록 블록 적층',
    desc:'흰 지형 위에 방문 횟수만큼 청록 블록이 솟습니다. 지금 /stats에 구현된 방식입니다.',
    note:'<strong>장점</strong> 높이와 색이 같은 값을 두 번 말해 주므로 한눈에 읽힙니다. <strong>약점</strong> 블록이 높아지면 뒤쪽 지역을 가립니다.',
    draw: drawStack,
  },
  {
    id:'plateau', tag:'시안 2', title:'지형 고원 · 색만 채움',
    desc:'블록 높이를 지형 한 단으로 고정하고 방문량을 색 농도로만 나타냅니다.',
    note:'<strong>장점</strong> 가림이 전혀 없고 전국 분포를 정확히 비교할 수 있습니다. <strong>약점</strong> 압도적으로 많이 간 지역의 존재감이 약합니다.',
    draw: drawPlateau,
  },
  {
    id:'pillar', tag:'시안 3', title:'수직 기둥 · 데이터 타워',
    desc:'지형은 얇게 깔고 방문량을 가느다란 기둥 높이로 세웁니다. 통계 차트에 가까운 인상입니다.',
    note:'<strong>장점</strong> 지역 간 차이가 가장 극적으로 보입니다. <strong>약점</strong> 지도라기보다 막대그래프로 읽혀 지리 감각이 약해집니다.',
    draw: drawPillar,
  },
  {
    id:'bubble', tag:'시안 4', title:'평면 지형 · 버블 오버레이',
    desc:'지형을 평면으로 눕히고 방문량을 원 크기로 얹습니다. 3D 부담이 가장 적습니다.',
    box:'-130 -30 260 150',
    note:'<strong>장점</strong> 모바일과 저사양 기기에서 가볍고 라벨 배치가 쉽습니다. <strong>약점</strong> 입체 기록 지도라는 제품 개성이 사라집니다.',
    draw: drawBubble,
  },
  {
    id:'terrace', tag:'시안 5', title:'계단식 등고 · 테라스',
    desc:'같은 방문 단계끼리 하나의 층을 이루도록 단을 겹쳐 등고선처럼 보이게 합니다.',
    note:'<strong>장점</strong> 방문 단계 경계가 명확해 범례와 정확히 대응합니다. <strong>약점</strong> 인접 지역의 단계가 같으면 경계가 흐려집니다.',
    draw: drawTerrace,
  },
  {
    id:'night', tag:'시안 6', title:'야경 · 빛나는 방문지',
    desc:'지형을 어둡게 낮추고 방문 지역만 빛으로 떠오르게 하는 감성 연출입니다.',
    note:'<strong>장점</strong> 기록이 쌓이는 경험이 감정적으로 전달됩니다. <strong>약점</strong> 미방문 지역의 판독성이 낮아 통계 화면으로는 불리합니다.',
    draw: drawNight,
  },
];

/* ── 공통 렌더 뼈대 ───────────────────────────────────────────────── */
function svgEl(name,attrs){
  const el=document.createElementNS('http://www.w3.org/2000/svg',name);
  for(const k in attrs) el.setAttribute(k,attrs[k]);
  return el;
}
function sortedCells(){
  return [...CELLS].sort((a,b)=>(a.q+a.r)-(b.q+b.r) || a.q-b.q);
}
/*
  기본 뷰박스는 블록이 위로 솟는 시안을 기준으로 위쪽 여백을 크게 잡는다.
  평면 시안은 솟는 높이가 없으므로 같은 뷰박스를 쓰면 지도가 아래로 몰린다.
*/
function frame(box){
  return svgEl('svg',{viewBox: box ?? '-135 -70 270 240', preserveAspectRatio:'xMidYMid meet'});
}

/* 시안 1 — 현재안: 지형 단 + 초록 블록 */
function drawStack(svg){
  const max=maxOf(data);
  for(const c of sortedCells()){
    const p=center(c.q,c.r), n=data[c.region]||0, lv=level(n,max);
    const land=cssVar('--map-land');
    prism(svg, p.x, p.y, 10, land);
    if(lv){
      const t=(lv-1)/4, top=visitColor(t);
      prism(svg, p.x, p.y-10, lv*HEX.level, top);
    }
  }
}
function prism(svg,cx,cy,h,fill){
  const top=corners(cx,cy-h);
  const [ ,,lr,bt,ll ]=top;
  svg.appendChild(svgEl('polygon',{points:poly([ll,bt,[bt[0],bt[1]+h],[ll[0],ll[1]+h]]),fill:shade(fill,.80)}));
  svg.appendChild(svgEl('polygon',{points:poly([bt,lr,[lr[0],lr[1]+h],[bt[0],bt[1]+h]]),fill:shade(fill,.90)}));
  svg.appendChild(svgEl('polygon',{points:poly(top),fill}));
}

/* 시안 2 — 고원: 높이 고정, 색으로만 */
function drawPlateau(svg){
  const max=maxOf(data);
  for(const c of sortedCells()){
    const p=center(c.q,c.r), n=data[c.region]||0, lv=level(n,max);
    const fill = lv ? visitColor((lv-1)/4) : cssVar('--map-land');
    prism(svg, p.x, p.y, 13, fill);
  }
}

/*
  시안 3 — 수직 기둥.
  지형을 모두 깐 다음 기둥을 세우면 앞쪽 지형이 뒤쪽 기둥의 밑동을 가린다.
  그래서 시·도마다 한 기둥만 세우고, 지형과 기둥을 같은 깊이 순서로 함께 그린다.
*/
function drawPillar(svg){
  const max=maxOf(data);
  const pillars=new Map();
  for(const {region,x,y} of regionCentroids()) pillars.set(region,{x,y});
  const items=[];
  for(const c of sortedCells()) items.push({depth:c.q+c.r, kind:'land', p:center(c.q,c.r)});
  for(const [region,p] of pillars){
    if(data[region]) items.push({depth:(p.x!==undefined? (p.y/HEX.stepY) : 0), kind:'pillar', region, p});
  }
  items.sort((a,b)=>a.depth-b.depth);
  const tops=[];
  for(const item of items){
    if(item.kind==='land'){ prism(svg, item.p.x, item.p.y, 5, cssVar('--map-land')); continue; }
    const n=data[item.region], t=Math.min(1,n/max), h=9+t*70, fill=visitColor(t), w=7.2;
    svg.appendChild(svgEl('rect',{x:(item.p.x-w/2).toFixed(2), y:(item.p.y-5-h).toFixed(2),
      width:w, height:h.toFixed(2), rx:2.4, fill}));
    svg.appendChild(svgEl('ellipse',{cx:item.p.x.toFixed(2), cy:(item.p.y-5-h).toFixed(2),
      rx:(w/2).toFixed(2), ry:2, fill:shade(fill,1.2)}));
    tops.push({region:item.region, n, x:item.p.x, y:item.p.y-5-h-6});
  }
  /*
    라벨을 기둥 바로 위에 두면 뒤쪽 기둥이 앞쪽 기둥에 가린다. 그래서 꼭대기
    옆으로 밀어 붙이고, 방문이 많은 지역부터 자리를 잡은 뒤 겹치는 자리는 건너뛴다.
  */
  const placed=[];
  for(const top of tops.sort((a,b)=>b.n-a.n)){
    if(top.n/max<=.28) continue;
    const side = top.x>=0 ? 1 : -1;
    const lx = top.x + side*10, ly = top.y + 4;
    if(placed.some(q=>Math.abs(q.x-lx)<20 && Math.abs(q.y-ly)<10)) continue;
    placed.push({x:lx,y:ly});
    const label=svgEl('text',{x:lx.toFixed(2), y:ly.toFixed(2),
      'text-anchor': side>0?'start':'end', 'font-size':7.5,'font-weight':'700',
      fill:cssVar('--ink-2'), stroke:cssVar('--map-water-light'),
      'stroke-width':2.2, 'paint-order':'stroke'});
    label.textContent=NAMES[top.region];
    svg.appendChild(label);
  }
}

/* 시안 4 — 평면 + 버블 */
function drawBubble(svg){
  const max=maxOf(data);
  for(const c of sortedCells()){
    const p=center(c.q,c.r);
    svg.appendChild(svgEl('polygon',{points:poly(corners(p.x,p.y)),
      fill:cssVar('--map-land'), stroke:cssVar('--border'), 'stroke-width':.7}));
  }
  for(const {region,x,y} of regionCentroids()){
    const n=data[region]||0; if(!n) continue;
    const t=Math.min(1,n/max), r=5.5+Math.sqrt(t)*14;
    svg.appendChild(svgEl('circle',{cx:x.toFixed(2), cy:y.toFixed(2),
      r:r.toFixed(2), fill:visitColor(t), opacity:.85,
      stroke:cssVar('--panel'), 'stroke-width':1.5}));
    svg.appendChild(svgEl('text',{x:x.toFixed(2), y:(y+2.6).toFixed(2),
      'text-anchor':'middle', 'font-size':r>10?7:0,
      fill:t>.55?'#ffffff':'#0d3f4c', 'font-weight':'700'})).textContent=String(n);
  }
}

/* 시·도별 무게중심. 라벨과 버블의 기준점 */
function regionCentroids(){
  const byRegion={};
  for(const c of CELLS){ (byRegion[c.region] ||= []).push(center(c.q,c.r)); }
  return Object.entries(byRegion).map(([region,pts])=>({
    region,
    x: pts.reduce((s,p)=>s+p.x,0)/pts.length,
    y: pts.reduce((s,p)=>s+p.y,0)/pts.length,
  }));
}

/* 시안 5 — 계단식 테라스 */
function drawTerrace(svg){
  const max=maxOf(data);
  for(const c of sortedCells()){
    const p=center(c.q,c.r), n=data[c.region]||0, lv=level(n,max);
    prism(svg, p.x, p.y, 8, cssVar('--map-land'));
    let base=8;
    for(let s=1;s<=lv;s++){
      const step=6.4, t=(s-1)/4;
      prism(svg, p.x, p.y-base, step, visitColor(t));
      base+=step;
    }
  }
}

/* 시안 6 — 야경 */
function drawNight(svg){
  const defs=svgEl('defs',{});
  const g=svgEl('radialGradient',{id:'glow'});
  g.appendChild(svgEl('stop',{offset:'0%','stop-color':'#9fe8f5','stop-opacity':'.85'}));
  g.appendChild(svgEl('stop',{offset:'100%','stop-color':'#9fe8f5','stop-opacity':'0'}));
  defs.appendChild(g); svg.appendChild(defs);
  svg.appendChild(svgEl('rect',{x:-200,y:-140,width:400,height:400,fill:'#0b1420'}));
  const max=maxOf(data);
  for(const c of sortedCells()){
    const p=center(c.q,c.r), n=data[c.region]||0, lv=level(n,max);
    prism(svg, p.x, p.y, 9, '#26303f');
    if(lv){
      const t=(lv-1)/4, h=lv*5.4;
      svg.appendChild(svgEl('circle',{cx:p.x.toFixed(2), cy:(p.y-9-h).toFixed(2),
        r:(12+t*16).toFixed(2), fill:'url(#glow)'}));
      prism(svg, p.x, p.y-9, h, mix('#2a6b7c','#9fe8f5',t));
    }
  }
}

/* ── 카드 만들기 ──────────────────────────────────────────────────── */
function buildCards(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  for(const concept of CONCEPTS){
    const card=document.createElement('figure');
    card.className='card'; card.style.margin='0';
    card.innerHTML=`
      <figcaption>
        <span class="badge">${concept.tag}</span>
        <h2>${concept.title}</h2>
        <p class="desc">${concept.desc}</p>
      </figcaption>
      <div class="stage" role="img" aria-label="${concept.title} 시안 미리보기"></div>
      <div class="legend" aria-hidden="true">
        <small>적게</small>
        <span class="bar"></span>
        <small>많이</small>
      </div>
      <p class="note">${concept.note}</p>`;
    const stage=card.querySelector('.stage');
    if(concept.id==='night'){ stage.style.background='#0b1420'; }
    const svg=frame(concept.box);
    concept.draw(svg);
    stage.appendChild(svg);
    const bar=card.querySelector('.bar');
    for(let i=0;i<5;i++){
      const i2=document.createElement('i');
      i2.style.background=visitColor(i/4);
      bar.appendChild(i2);
    }
    grid.appendChild(card);
  }
}

document.getElementById('themeToggle').addEventListener('click', e=>{
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
  e.currentTarget.setAttribute('aria-pressed', String(!dark));
  e.currentTarget.textContent = dark ? '다크 모드로 보기' : '라이트 모드로 보기';
  buildCards();
});
document.getElementById('dataToggle').addEventListener('click', e=>{
  const second = data===DATASETS[1];
  data = second ? DATASETS[0] : DATASETS[1];
  e.currentTarget.setAttribute('aria-pressed', String(!second));
  e.currentTarget.textContent = second ? '데이터 바꿔 보기' : '원래 데이터로';
  buildCards();
});

document.documentElement.setAttribute('data-theme','light');
buildCards();
</script>
